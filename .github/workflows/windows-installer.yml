name: Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch pinned voice runtime
        run: node scripts/fetch-vendor.js

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Build NSIS installer
        working-directory: app
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ -n "${CSC_LINK_SECRET}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export CSC_LINK="${CSC_LINK_SECRET}"
            export CSC_KEY_PASSWORD="${CSC_KEY_PASSWORD_SECRET}"
          fi
          npx electron-builder --win nsis --x64

      - name: Upload setup executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-pet-setup
          path: app/dist/*.exe
          if-no-files-found: error

  release:
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download setup executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-pet-setup
          path: dist

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.exe
