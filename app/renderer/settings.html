<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: file: blob:; font-src 'self'; media-src 'self' blob: mediastream:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'" />

    <meta charset="UTF-8" />
    <title>设置</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-label">设置</span>
      <div class="titlebar-controls">
        <button type="button" class="win-btn" data-win="min" title="最小化" aria-label="最小化"></button>
        <button type="button" class="win-btn win-close" data-win="close" title="关闭" aria-label="关闭"></button>
      </div>
    </header>
    <main>
      <h1>设置</h1>
      <p class="hint">Key 用系统加密存在本机。文字会发给 DeepSeek。查看屏幕默认关闭，打开后截图才会发给视觉接口。</p>

      <section>
        <h2>对话</h2>
        <label class="toggle">
          <input id="deepseekEnabled" type="checkbox" />
          <i></i>
          <span>DeepSeek 对话</span>
        </label>
        <label class="field">
          API Key
          <input id="deepseekApiKey" type="password" placeholder="sk-…" autocomplete="off" />
        </label>
        <p id="keyHint" class="hint"></p>
        <label class="field">
          接口
          <input id="deepseekBaseUrl" type="text" />
        </label>
        <div class="field-row">
          <label class="field">
            文本模型
            <input id="deepseekModel" type="text" />
          </label>
          <label class="field">
            视觉模型
            <input id="visionModel" type="text" />
          </label>
        </div>
      </section>

      <section>
        <h2>窗口</h2>
        <label class="toggle">
          <input id="alwaysOnTop" type="checkbox" />
          <i></i>
          <span>始终置顶</span>
        </label>
        <label class="toggle">
          <input id="lifeStream" type="checkbox" />
          <i></i>
          <span>自己过日子（暂时关闭：不自动切动作）</span>
        </label>
        <p class="hint">自动切动作先关掉，只循环待机；托盘/单击仍可手动播。左右走用同一套行走帧做水平翻转。</p>
        <label class="toggle">
          <input id="hideOnFullscreen" type="checkbox" />
          <i></i>
          <span>全屏时隐藏</span>
        </label>
      </section>

      <section>
        <h2>快捷键</h2>
        <label class="field">
          隐藏 / 显示
          <div class="hotkey-row">
            <input id="hideHotkey" class="hotkey" type="text" readonly placeholder="点击后按下组合键" />
            <button type="button" id="clearHideHotkey">清除</button>
          </div>
        </label>
        <label class="field">
          开始 / 结束语音
          <div class="hotkey-row">
            <input id="voiceHotkey" class="hotkey" type="text" readonly placeholder="点击后按下组合键" />
            <button type="button" id="clearVoiceHotkey">清除</button>
          </div>
        </label>
        <p class="hint">全局生效。至少双键，如 Shift+~。两项不能相同。</p>
      </section>

      <section>
        <h2>记忆与屏幕</h2>
        <label class="toggle">
          <input id="memoryEnabled" type="checkbox" />
          <i></i>
          <span>记住对话</span>
        </label>
        <p class="hint">默认关闭。打开后，对话摘要和你让它记住的内容保存在本机。</p>
        <label class="toggle">
          <input id="visionEnabled" type="checkbox" />
          <i></i>
          <span>允许查看屏幕</span>
        </label>
        <p class="hint">默认关闭。打开后，只有你让它看屏幕时才会截图，并在画面上提示。碎碎念不会截屏。</p>
      </section>

      <div class="actions">
        <button type="button" class="primary" id="save">保存</button>
        <button type="button" id="clearAll">清除全部聊天记录和记忆</button>
        <button type="button" id="importDpet">导入 .dpet</button>
        <button type="button" id="importFolder">导入文件夹</button>
      </div>
      <p id="status" class="status"></p>
    </main>
    <script src="../lib/hotkeys.js"></script>
    <script src="./chrome.js"></script>
    <script src="./settings.js"></script>
  </body>
</html>
