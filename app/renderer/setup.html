<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>环境依赖</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-label">环境</span>
      <div class="titlebar-controls">
        <button type="button" class="win-btn" data-win="min" title="最小化" aria-label="最小化"></button>
        <button type="button" class="win-btn win-close" data-win="close" title="关闭" aria-label="关闭"></button>
      </div>
    </header>
    <main>
      <h1>运行环境</h1>
      <p class="hint">
        语音用 sherpa-onnx + SenseVoice-Small。缺的一键装进仓库 <code>.deps/</code>，不改系统 PATH。
      </p>
      <div id="list"></div>
      <div class="actions">
        <button type="button" class="primary" id="install">一键安装缺失项</button>
        <button type="button" id="refresh">重新检测</button>
        <button type="button" id="continue">继续</button>
      </div>
      <div id="log">正在检测…</div>
    </main>
    <script src="./chrome.js"></script>
    <script src="./setup.js"></script>
  </body>
</html>
